<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title"><title id="title">Interests: data science, intelligent applications, engineering, AI and RAG, databases and DSA</title><defs><radialGradient id="glow"><stop stop-color="#164c99" stop-opacity=".42"/><stop offset="1" stop-color="#09111f" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#607b9b" stroke-opacity=".07"/></pattern></defs><rect width="1200" height="590" rx="24" fill="#09111f"/><rect x="1" y="1" width="1198" height="588" rx="24" fill="url(#grid)" stroke="#273d5c"/><ellipse cx="970" cy="160" rx="450" ry="330" fill="url(#glow)"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="44" y="48" font-size="14" fill="#75adff" font-weight="700">02 / FROM CURIOSITY TO CODE</text><text x="44" y="104" font-size="43" fill="#edf3ff" font-weight="800">IDEAS. BUILT WITH DATA.</text><rect x="44" y="140" width="352" height="180" rx="18" fill="#101d32" stroke="#273d5c"/><text x="66" y="177" font-size="16" fill="#75adff" font-weight="400">01</text><text x="66" y="220" font-size="24" fill="#edf3ff" font-weight="700">DATA SCIENCE</text><text x="66" y="258" font-size="15" fill="#adbed8" font-weight="400">Explore patterns. Ask better questions.</text><text x="66" y="285" font-size="15" fill="#adbed8" font-weight="400">Turn analysis into useful insights.</text><rect x="424" y="140" width="352" height="180" rx="18" fill="#101d32" stroke="#273d5c"/><text x="446" y="177" font-size="16" fill="#75adff" font-weight="400">02</text><text x="446" y="220" font-size="24" fill="#edf3ff" font-weight="700">INTELLIGENT APPS</text><text x="446" y="258" font-size="15" fill="#adbed8" font-weight="400">Connect AI with modern software.</text><text x="446" y="285" font-size="15" fill="#adbed8" font-weight="400">Build around real-world problems.</text><rect x="804" y="140" width="352" height="180" rx="18" fill="#101d32" stroke="#273d5c"/><text x="826" y="177" font-size="16" fill="#75adff" font-weight="400">03</text><text x="826" y="220" font-size="24" fill="#edf3ff" font-weight="700">ENGINEERING</text><text x="826" y="258" font-size="15" fill="#adbed8" font-weight="400">Think in systems and algorithms.</text><text x="826" y="285" font-size="15" fill="#adbed8" font-weight="400">Keep improving the fundamentals.</text><text x="44" y="380" font-size="26" fill="#edf3ff" font-weight="700">WHAT I’M EXPLORING</text><text x="44" y="424" font-size="17" fill="#75adff" font-weight="700">AI &amp; RAG</text><text x="294" y="424" font-size="17" fill="#adbed8" font-weight="400">Predictive models, NLP and retrieval-augmented generation.</text><text x="44" y="487" font-size="17" fill="#75adff" font-weight="700">DATA &amp; DATABASES</text><text x="294" y="487" font-size="17" fill="#adbed8" font-weight="400">EDA, statistical analysis, SQL and data pipelines.</text><text x="44" y="550" font-size="17" fill="#75adff" font-weight="700">SYSTEMS &amp; DSA</text><text x="294" y="550" font-size="17" fill="#adbed8" font-weight="400">Algorithms, scalable backends, Docker and AWS.</text></g></svg>